modules["src/components/food-images.js"]=(()=>{const imageAccept='image/jpeg,image/png,image/webp';

async function prepareMealPhoto(file){

    throw Error('请选择 5 MB 以内的 JPEG、PNG 或 WebP 图片。');
  }

    const image=new Image();
    image.src=url;
    await image.decode();
    const ratio=Math.min(1,1280/Math.max(image.naturalWidth,image.naturalHeight));
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.naturalWidth*ratio));

  }finally{URL.revokeObjectURL(url);}

function bindBodyForm(host,editing) {
  const form=host.querySelector('#body-form');
  form.addEventListener('change',event=>{
    if (event.target.name!=='weightUnit') return;
    const input=form.elements.weightKg;
    const toJin=event.target.value==='jin';
    if (input.value) input.value=String(Math.round(Number(input.value)*(toJin?2:0.5)*10)/10);
    input.min=toJin?40:20;
    input.max=toJin?800:400;
  });
  form.addEventListener('submit',event=>{
    event.preventDefault();
    const input={...Object.fromEntries(new FormData(form)),id:editing?.id};
    const save=()=>{
      try {
        const record=saveBodyRecord(input);
        const message=!editing&&weightFeedback(record,store.get());
        if (message) showPetFeedback('weight','体重已保存',message);
        else toast(store.warning||'身体数据已保存');
        if (editing) navigate('21');
        else renderBody(host,{});
      } catch (error) { fail(host,error); }
    };
    try {
      if (weightNeedsCheck(input,store.get())) {
        showModal({title:'核对体重和单位',body:'<p>这次读数与近期记录相差较大。请核对测量值和选择的单位。</p>',actions:[
          {label:'返回核对',variant:'ghost'},
          {label:'数值无误，保存',onClick:save}
        ]});
      } else save();
    } catch (error) { fail(host,error); }
  });
}

      ${btn('重新尝试','demo-retry','')}${btn('返回上传照片','demo-close')}`:''}
    ${complete?`<p class="demo-progress" role="status"><strong>${status==='partial'?'部分识别 · 请手动补充':'样例识别成功'}</strong> · 样例识别结果</p>
      ${menu?`<p class="small">${example.dishes.filter(dish=>!dish.uncertain).length} 道菜已整理${status==='partial'?' · 1 项待确认':''}</p>
        <div class="demo-result-list">${example.dishes.map(dish=>`<div>${dishLine(dish)}<small>${dish.uncertain?'待确认 · 请手动补充':esc(dish.description)}</small></div>`).join('')}</div>`:
        `<h3>${esc(example.label.name)} · ${labelBases[example.label.basis]}</h3>
        <dl class="label-values">${Object.entries(labelFields).map(([key,name])=>{
          const value=example.label[key],unit=key==='energy'?example.label.energyUnit:key==='sodiumMg'?'mg':'g';
          return `<div><dt>${name}</dt><dd>${value==null?'待确认 · 请手动补充':value+' '+unit}</dd></div>`;
        }).join('')}</dl>`}
      ${btn(menu?'查看并核对菜品':'查看并核对营养','demo-apply','')}`:''}
    ${status==='uploading'?`${resolveRoute()?.query.qa==='1'?`<details><summary>看看识别不清时怎么办</summary><label class="field">查看其他识别结果<select data-demo-outcome>${options({success:'识别成功',partial:'部分识别',failed:'识别失败'},outcome)}</select></label></details>`:''}
      ${btn('开始识别样例','demo-start','')}`:''}
    ${!working&&status!=='failed'?btn('返回上传照片','demo-close'):''}

}

function beginDemo(host,session,render,retry,fixture) {
  if(retry) selectExample(session,fixture('success'));
  let activePage;
  return runRecognitionDemo(session,{active:()=>activePage?.isConnected,onStart:()=>{
    render();
    activePage=host.querySelector('main');
  }}).then(completed=>{if(completed)render();});
}

function renderMenuCapture(host,query={}) {
  const menu=ensureMenu(query.scene);
  if(['editing','saved'].includes(menuDemo.status)) menuDemo=createRecognitionDemo();
  const isRestaurant=(menuDemo.example?.kind||menu.scene)==='restaurant';
  const render=()=>renderMenuCapture(host,query);
  const page=frame(host,'13','菜单拍摄',{id:'12'},`${switchMode('拍菜单','拍食物','food')}
    <section class="card tool-hero ${isRestaurant?'tool-warm':''}"><span class="badge">小芽点餐助手</span>
      <h1>拍菜单，帮你选</h1>
      <div class="grid2">${btn('外卖菜单','delivery',isRestaurant?'ghost':'secondary')}${btn('饭店菜单','restaurant',isRestaurant?'secondary':'ghost')}</div>
    </section>
    ${menuDemo.example?demoPanel(menuDemo,'menu'):`
    ${menuImages.length?`<p class="small">已选 ${menuImages.length} / 6 张自己的照片</p><div class="menu-photo-grid">${menuImages.map((image,index)=>`<figure><img src="${esc(image)}" alt="菜单照片 ${index+1}"><button type="button" class="btn ghost" data-photo-remove="${index}">删除第 ${index+1} 张</button></figure>`).join('')}</div>`:'<div class="tool-viewfinder"><strong>添加菜单照片</strong><span>支持商家截图或纸质菜单，最多 6 张</span></div>'}
    ${imagePickers('menu-image',true)}
    <p class="small">照片仅供核对。</p>`}
    ${errors}
    ${menuDemo.status!=='recognizing'?btn(menu.dishes.length&&!menuDemo.example?'继续核对菜单':'手动添加菜品','manual','secondary'):''}
    ${!menuDemo.example?`<section class="card tool-stack"><h2>${menuImages.length?'查看识别效果示例':'体验示例菜单'}</h2><div class="grid2">
      ${btn('示例 A：外卖菜单','sample-delivery','secondary')}${btn('示例 B：饭店菜单','sample-restaurant','secondary')}</div></section>
      ${menu.dishes.length||menuImages.length?btn('开始新菜单','new-menu'):''}`:''}`);
  page.addEventListener('change',async event=>{
    if(event.target.matches('[data-demo-outcome]')){
      const outcome=event.target.value;
      selectExample(menuDemo,menuExampleFixture(menuDemo.example.kind,outcome),outcome);render();return;
    }
    if (!event.target.id.startsWith('menu-image-')) return;
    const selected=[...event.target.files];
    event.target.value='';
    if (selected.length+menuImages.length>6) { message(page,'一次最多保留 6 张照片。'); return; }
    const results=await Promise.allSettled(selected.map(readFoodImage));
    if (!page.isConnected) return;
    menuImages.push(...results.filter(result=>result.status==='fulfilled').map(result=>result.value).slice(0,6-menuImages.length));
    render();
    const failed=results.find(result=>result.status==='rejected');
    if (failed) message(host.querySelector('main'),failed.reason);
  });
  page.addEventListener('click',async event=>{
    const action=event.target.closest('[data-tool]')?.dataset.tool;
    const remove=event.target.closest('[data-photo-remove]');
    if (remove) { menuImages.splice(Number(remove.dataset.photoRemove),1); render(); return; }
    if (action==='food') navigate('13');
    if (action==='new-menu') {
      showModal({title:'开始新菜单？',body:'<p>会清除本次未保存的菜单和照片，已经保存的待点清单会保留。</p>',actions:[{label:'取消',variant:'ghost'},{label:'开始新菜单',onClick:()=>{menuImages.length=0;store.update(s=>{s.menuDraft=newMenu(menu.scene);});renderMenuCapture(host);}}]});
      return;
    }
    if(action==='demo-close'){menuDemo=createRecognitionDemo();render();return;}
    if (action==='manual') {
      menuDemo=createRecognitionDemo();
      if(menuImages.length&&menu.source==='example'){
        showModal({title:'改为手动核对？',body:'<p>将新建自己的菜单，已保存的待点清单保留。</p>',actions:[{label:'取消',variant:'ghost'},{label:'手动添加菜品',onClick:()=>{
          store.update(s=>{s.menuDraft=newMenu(menu.scene);});menuRoute('14','review');
        }}]});return;
      }
      menuRoute('14','review');return;
    }
    if (action==='delivery'||action==='restaurant') {
      if (menu.scene===action&&!menuDemo.example) return;
      updateMenu(current=>{current.scene=action;current.preferences.partySize=action==='restaurant'?3:1;if(action==='restaurant')current.preferences.balance=true;resetRecommendation(current);});
      menuDemo=createRecognitionDemo();render();return;
    }
    if(action==='sample-delivery'||action==='sample-restaurant'){
      selectExample(menuDemo,menuExampleFixture(action.slice(7)));render();host.querySelector('.demo-panel')?.scrollIntoView({block:'start'});return;
    }
    if(action==='demo-start'||action==='demo-retry'){
      await beginDemo(host,menuDemo,render,action==='demo-retry',outcome=>menuExampleFixture(menuDemo.example.kind,outcome));return;
    }
    if(action==='demo-apply'&&['success','partial'].includes(menuDemo.status)){
      const example=menuDemo.example;
      const apply=()=>{
        const next=newMenu(example.kind);
        Object.assign(next,{source:'example',dishes:example.dishes});
        store.update(s=>{s.menuDraft=next;});menuDemo.status='editing';menuRoute('14','review');
      };
      if(menu.dishes.length)showModal({title:'使用示例菜单？',body:'<p>将替换当前未保存的菜品。已保存的待点清单不受影响。</p>',actions:[{label:'取消',variant:'ghost'},{label:'使用示例菜单',onClick:apply}]});
      else apply();
    }
  });
}

      <label class="field">优先类别<select name="type">${options({any:'不限',...dishTypes},p.type)}</select></label>
    </div>

    ${profile.aiConsent?`<label class="tool-check"><input type="checkbox" name="useProfile" ${p.useProfile?'checked':''}>参考已授权的健康目标、饮食偏好和限制</label>
      ${profile.goal||profile.dietPreferences?.length||profile.restrictions?`<p class="small">已填写档案：${esc([profile.goal,...(profile.dietPreferences||[]),profile.restrictions].filter(Boolean).join(' · '))}。勾选即可参考，无需重复填写。</p>`:''}`:'<p class="small">可直接按本次填写的条件推荐。</p>'}

function dishLine(dish,reason='') {
  return `<span><strong>${esc(dish.name||'菜名无法确认')}</strong><small>${dish.uncertain&&dish.priceCents==null?'价格无法确认':price(dish.priceCents)} · ${dishTypes[dish.type]} · ${tastes[dish.taste]}</small>${reason?`<small>${esc(reason)}</small>`:''}</span>`;
}

function recommendationCards(menu,state) {
  if (!menu.analysis) return '';
  const result=recommendMenu(menu,state);
  const selected=menu.selected.map(id=>menu.dishes.find(dish=>dish.id===id)).filter(Boolean);
  const preferred=result.groups[0]||[];
  const alternate=result.groups.slice(1);
  const cost=menuTotal(selected);
  const adopted=preferred.length>0&&preferred.length===selected.length&&preferred.every(dish=>menu.selected.includes(dish.id));
  return `<section class="card tool-stack tool-recommend"><span class="badge">小芽建议 · 菜单搭配参考</span>
    <h2>推荐组合</h2>
    ${preferred.length?`<p class="tool-combo">${price(menuTotal(preferred))}${combinationReason(preferred,menu.preferences)?' · '+esc(combinationReason(preferred,menu.preferences)):''}</p>
      ${btn(adopted?'已采用 · 查看待点清单':'采用这套组合',adopted?'show-pending':'group:0','')}`:''}
    ${!preferred.length?'<p>暂无符合条件的菜品，试试调整条件。</p>':preferred.map(dish=>`<div class="tool-line">${dishLine(dish,menuReason(dish,menu.preferences))}${btn(menu.selected.includes(dish.id)?'已选':'加入待点','add:'+dish.id,'secondary')}</div>`).join('')}
    <p class="small">${esc(result.note)}</p>
    ${result.notices.length?`<p class="small">依据有限：${esc(result.notices.join('；'))}。</p>`:''}${result.insight?`<p class="small">${esc(result.insight)}</p>`:''}
    ${menu.preferences.useProfile&&state.profile.aiConsent&&state.profile.goal?`<p class="small">当前目标：${esc(state.profile.goal)}。可按实际饱腹感调整份量。</p>`:''}
    ${alternate.length?`<details><summary>其他推荐组合（${alternate.length}）</summary>${alternate.map((group,i)=>`<div class="tool-line"><span><strong>备选 ${i+1}</strong><small>${esc(group.map(dish=>dish.name).join('、'))} · ${price(menuTotal(group))}</small><small>${esc(combinationReason(group,menu.preferences))}</small></span>${btn('采用','group:'+(i+1))}</div>`).join('')}</details>`:''}
    ${btn('问问小芽','ask','secondary')}
    <p class="note">请向商家确认过敏原和交叉接触风险。</p>
  </section>
  <section class="card tool-stack" id="menu-pending"><h2>待点清单</h2>
    ${selected.length?selected.map(dish=>`<div class="tool-line">${dishLine(dish)}${btn('移除','drop:'+dish.id)}</div>`).join(''):'<p class="small">先从建议或备选里加入想点的菜。</p>'}
    <p>${cost===null?'价格未齐，不估算合计。':`菜单合计 ${price(cost)}${menu.preferences.budget!=null&&cost>menu.preferences.budget*100?' · 超出本次预算':''}`}</p>
    <details><summary>其他可选菜品</summary>${result.candidates.filter(dish=>!menu.selected.includes(dish.id)).map(dish=>`<div class="tool-line">${dishLine(dish)}${btn('加入','add:'+dish.id)}</div>`).join('')||'<p class="small">暂无其他符合条件的菜品。</p>'}</details>
    ${btn('保存待点清单','save-menu','')}
    <p class="small">待点清单不计入饮食日记。</p>
  </section>`;
}

function renderMenuResult(host,query={}) {
  const menu=ensureMenu();
  const state=store.get();
  const step=query.step==='preferences'&&menu.dishes.length?'preferences':
    (query.step==='result'||!query.step)&&menu.analysis?'result':'review';
  const page=frame(host,'14',menu.scene==='restaurant'?'饭店点菜':'外卖点餐',{id:'13',query:{mode:'menu'}},`
    ${steps(['核对菜品','选择偏好','查看推荐'],['review','preferences','result'].indexOf(step))}
    <section class="card tool-hero ${menu.scene==='restaurant'?'tool-warm':''}"><span class="badge">${menu.source==='example'?'样例识别结果':'手动核对'}</span>
      <h1>${{review:'先核对菜单',preferences:'这餐想怎么吃？',result:'按你的条件推荐'}[step]}</h1><p>${menu.dishes.filter(dish=>dish.name).length} 道菜 · ${menu.dishes.filter(dish=>dish.uncertain).length} 项待确认${menu.source==='example'?' · 来自预设图片':''}</p></section>
    ${errors}${step==='review'?`
    ${menu.dishes.length?btn('下一步：选择偏好','preferences',''):''}
    ${menu.source==='example'&&menuDemo.example?.kind===menu.scene?`<details class="card tool-stack"><summary>参考预设菜单图片</summary><figure class="demo-picture"><img src="${esc(menuDemo.example.image)}" alt="预设菜单图片"></figure></details>`:
      menu.source!=='example'&&menuImages.length?`<details class="card tool-stack"><summary>参考上传的菜单照片</summary><div class="menu-photo-grid">${menuImages.map((image,i)=>`<figure><img src="${esc(image)}" alt="菜单参考照片 ${i+1}"></figure>`).join('')}</div></details>`:''}
    <section class="card tool-stack"><h2>菜品清单</h2>
      ${menu.dishes.map((dish,index)=>`<details class="tool-dish"><summary>${dishLine(dish)}<span>${dish.uncertain?'待确认 · 补充':'修改'}</span></summary>${dish.description?`<p class="small">${esc(dish.description)}</p>`:''}${dishForm(dish,index)}</details>`).join('')}
      <details ${menu.dishes.length===0?'open':''}><summary>＋ 手动添加菜品</summary>${dishForm()}</details></section>
    ${menu.dishes.length?btn('下一步：选择偏好','preferences','secondary'):''}
    `:step==='preferences'?`${preferenceForm(menu,state.profile)}${btn('返回核对菜品','review')}`:
    `<div class="grid2">${btn('修改菜品','review')}${btn('调整条件','preferences','secondary')}</div>${recommendationCards(menu,state)}`}`);
  page.addEventListener('submit',event=>{
    event.preventDefault();
    const form=event.target;
    const values=Object.fromEntries(new FormData(form));
    try {
      if (form.matches('[data-menu-preferences]')) {
        if (!menu.dishes.length) throw Error('请先添加并核对至少一道菜。');
        if (page.querySelector('[data-dish-index][data-dirty]')) throw Error('请先确认菜品修改，再生成推荐。');
        const preferences=menuPreferences(values,menu.scene,state.profile);
        try{confirmMenuAnalysis(preferences);}catch(error){
          if(error.code!=='AI_USAGE_LIMIT')throw error;
          updateMenu(current=>{current.pendingPreferences=preferences;});
          showAIUsageLimit('menuAnalysis',error.entitlement);return;
        }
        menuRoute('14','result');return;
      } else {
        const index=Number(form.dataset.dishIndex);
        if (index<0&&menu.dishes.length>=24) throw Error('最多可保留 24 道菜。');
        const dish=normalizeDish(values,menu.dishes[index]?.id);
        if(menu.dishes.some((other,i)=>i!==index&&dishKey(other.name)===dishKey(dish.name)))throw Error('已有同名菜品，请修改原条目。不同规格可在菜名中注明。');
        updateMenu(current=>{if(index<0)current.dishes.push(dish);else current.dishes[index]=dish;resetRecommendation(current);});
      }
      renderMenuResult(host,query);
    } catch(error) { message(page,error); }
  });
  page.addEventListener('input',event=>{
    const form=event.target.closest('[data-dish-index]');
    if(form) form.dataset.dirty='true';
  });
  page.addEventListener('click',event=>{
    const remove=event.target.closest('[data-remove-dish]');
    const action=event.target.closest('[data-tool]')?.dataset.tool;
    if(action==='show-pending'){page.querySelector('#menu-pending')?.scrollIntoView({block:'start'});return;}
    if(action==='review'){menuRoute('14','review');return;}
    if(action==='preferences'){
      if(page.querySelector('[data-dish-index][data-dirty]')){message(page,'请先确认菜品修改，再选择偏好。');return;}
      menuRoute('14','preferences');return;
    }
    if (!remove&&!/^(save-menu|ask|add:|drop:|group:)/.test(action||'')) return;
    try {
      if (!remove&&page.querySelector('[data-dish-index][data-dirty]')) throw Error('请先确认菜品修改。');
      if (!remove&&page.querySelector('[data-menu-preferences][data-dirty]')&&action!=='ask') throw Error('请先用修改后的条件重新生成推荐。');
      if (remove) updateMenu(current=>{current.dishes.splice(Number(remove.dataset.removeDish),1);resetRecommendation(current);});
      else if (action==='save-menu') { savePendingMenu(menu);if(menuDemo.example)menuDemo.status='saved';toast(store.warning||'已保存待点清单，可在饮食日记查看。');return; }
      else if (action==='ask') {
        navigateCoachChat({menu:menu.id,from:'14'});return;
      } else {
        const [op,id]=action.split(':');
        const result=recommendMenu(menu,state);
        updateMenu(current=>{
          if (op==='group') current.selected=(result.groups[Number(id)]||[]).map(dish=>dish.id);
          if (op==='add'&&result.candidates.some(dish=>dish.id===id)){
            const selected=[...new Set([...current.selected,id])];
            verifyMenuBudget(selected.map(key=>current.dishes.find(dish=>dish.id===key)).filter(Boolean),current.preferences);
            current.selected=selected;
          }
          if (op==='drop') current.selected=current.selected.filter(key=>key!==id);
        });
      }
      renderMenuResult(host,query);
      if(action?.startsWith('group:'))host.querySelector('#menu-pending')?.scrollIntoView({block:'start'});
    } catch(error) { message(page,error); }
  });
  page.addEventListener('change',event=>{
    const form=event.target.closest('[data-menu-preferences]');
    if(form) form.dataset.dirty='true';
  });
}

function labelScope(query) {
  const key=`${query.item||''}:${query.food||''}`;
  if (labelSession?.key===key) return labelSession;
  const state=store.get();
  const item=state.dietDraft?.items.find(item=>item.id===query.item&&item.label);
  const saved=state.customFoods.find(food=>food.id===query.food);
  const label=saved?.label||item?.label||{name:'',basis:'g',energyUnit:'kJ',extra:[]};
  labelSession={key,image:'',demo:createRecognitionDemo(),example:label.source==='example'||label.name==='燕麦饮（示例）',values:{...label,quantity:item?.quantity??(label.basis==='serving'?1:100),quantityUnit:saved?label.basis:item?.quantityUnit||label.basis},
    step:item||saved?'review':'capture',savedId:saved?.id||null,itemId:item?.id||null};

      await recognizeDraft({kind:'photo',image,photoRef:current.ref,samplePhoto:current.demo,requestId:current.requestId,replaceDraft:current.replaceDraft,signal:controller.signal,simulateFailure,isCurrent,charge});

function mealTotals(items) {
  const valid = items.filter(Boolean);
  if (!valid.length) return '<p class="small">添加有效食物后显示营养估算。</p>';
  const n = totals(valid);
  const status=key=>n[key]===null?'未知':valid.length!==items.length||valid.some(item=>nutritionStatus(item,key)==='unknown')?'部分合计':valid.some(item=>nutritionStatus(item,key)==='estimated')?'估算':'已知';
  return `<div class="result-energy"><strong>${valid.every(item=>item.kcal==null)?'—':fmt(n.kcal)}</strong><span>kcal · ${status('kcal')}</span></div>
    <div class="result-macros">${['proteinG','carbsG','fatG'].map(k=>`<div><span>${nutrientNames[k]}</span><b>${valid.every(item=>item[k]==null)?'—':fmt(n[k])} <small>g · ${status(k)}</small></b></div>`).join('')}</div>`;
}

}

function replyMarkup(message){
  const paragraphs = String(message.text).split(/\n+/).filter(Boolean);
  return paragraphs.flatMap(paragraph=>{
    if(message.role!=='assistant'||paragraph.length<52)return [paragraph];
    const sentences=paragraph.match(/[^。！？]+[。！？]*|[。！？]+/g)||[paragraph];
    const chunks=[sentences[0]];
    for(const [index,sentence] of sentences.slice(1).entries()){
      if(index===0||chunks.at(-1).length+sentence.length>64)chunks.push(sentence);
      else chunks[chunks.length-1]+=sentence;
    }
    return chunks;
  }).map(paragraph=>`<p>${esc(paragraph)}</p>`).join('');
}

function messageMarkup(message,conversation){
  const assistant=message.role==='assistant';
  const sources=Object.entries(message.contextUsed||{}).filter(([,used])=>used).map(([key])=>scopes[key]).filter(Boolean);
  const sourceText=sources.join('、')||(message.card?.title==='回到菜单'?'本轮消息与已核对菜单':'仅本轮消息，无健康数据');
  const time=new Date(message.createdAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  return `<article class="coach-message ${message.role}">
    ${assistant?`<div class="coach-message-avatar">${coachSVG(undefined,'listen')}</div>`:''}
    <div class="coach-message-content"><span class="coach-message-name">${assistant?'小芽':'我'} · ${esc(time)}</span>
      <div class="chat-reply">${replyMarkup(message)}</div>
      ${assistant?`${suggestionHTML(message,conversation)}<details class="chat-message-context"><summary>本次参考</summary><p>${esc(sourceText)}</p></details>`:''}
    </div></article>`;
}

function draftKey(query){

function getDraft(state,query){
  const key=draftKey(query);
  if(!key)return state.profile.coachDraft||'';
  const saved=state.profile.coachContextDrafts?.[key];
  if(typeof saved==='string')return saved;
  if(query.menu===state.menuDraft?.id&&query.menu)return menuPrompt;

}
